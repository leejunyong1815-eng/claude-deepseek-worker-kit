# agents/hooks/check.conf — post-edit-check.sh 설정 (쉘 문법). 없어도 동작한다.
# LINT_PY="auto"        # auto | ruff | pyflakes | none
# TEST_CMD="none"       # 기본 none(문법·lint 만). auto = tests/ 가 있으면 편집마다 pytest -x -q. 직접 지정 예: "PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -x -q -p no:cacheprovider tests/unit"
#                       # 벤치마크(2026-10-29)에서 편집마다 테스트를 돌리면 어려운 태스크가 더 못 풀었다 → 기본은 끔
# TEST_ON='\.py$'       # 이 정규식에 맞는 파일을 고쳤을 때만 테스트 실행
# TEST_TIMEOUT=120      # 초. 큰 테스트 묶음이면 TEST_CMD 를 빠른 부분 집합으로 줄이는 편이 낫다
# TAIL_LINES=40         # 모델에게 돌려줄 테스트 출력 줄 수
